  <title>Chart of Accounts Practice — ACCT 2301</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --violet:   #262D68;
      --violet-h: #1a2050;
      --yellow:   #D7DF23;
      --orange:   #FF9F1C;
      --blue:     #1a5fa8;
      --red:      #a31524;
      --green:    #0A713A;
      --bg:       #f2f1ed;
      --card:     #ffffff;
      --text:     #1a1c2e;
      --muted:    #4d5080;
      --border:   #c8cade;
    }

    /* ── Accessibility ─────────────────────────────────────────────── */
    .skip-link {
      position: absolute; top: -48px; left: 0;
      background: var(--yellow); color: #111; padding: 10px 18px;
      font-family: 'Atkinson Hyperlegible', sans-serif; font-weight: 600;
      border-radius: 0 0 6px 0; text-decoration: none; z-index: 200;
      transition: top 0.15s;
    }
    .skip-link:focus { top: 0; }

    :focus-visible {
      outline: 3px solid var(--orange);
      outline-offset: 3px;
      border-radius: 4px;
    }

    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); white-space: nowrap; border-width: 0;
    }

    /* ── Base ──────────────────────────────────────────────────────── */
    html { font-size: 16px; scroll-behavior: smooth; }

    body {
      font-family: 'Atkinson Hyperlegible', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.55;
    }

    /* ── Header ────────────────────────────────────────────────────── */
    .site-header {
      background: var(--violet);
      padding: 18px 24px 14px;
      display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    }
    .site-header h1 {
      font-family: 'Atkinson Hyperlegible', sans-serif;
      font-weight: 700;
      font-size: clamp(1.15rem, 3.5vw, 1.55rem);
      color: #fff;
      line-height: 1.1;
    }
    .course-tag {
      font-size: 0.8rem; color: rgba(255,255,255,0.72); font-weight: 400;
    }
    .yellow-stripe { height: 5px; background: var(--yellow); }

    /* ── Layout ────────────────────────────────────────────────────── */
    main { max-width: 740px; margin: 0 auto; padding: 28px 16px 80px; }

    .stack    { display: flex; flex-direction: column; gap: 12px; }
    .stack-lg { display: flex; flex-direction: column; gap: 22px; }
    .row      { display: flex; align-items: center; gap: 12px; }
    .row-between { display: flex; justify-content: space-between; align-items: center; }

    /* ── Cards ─────────────────────────────────────────────────────── */
    .card {
      background: var(--card);
      border-radius: 14px;
      box-shadow: 0 2px 14px rgba(38,45,104,.09), 0 1px 3px rgba(38,45,104,.07);
      padding: 28px;
    }

    /* ── Buttons ───────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 11px 22px; border-radius: 8px;
      font-family: 'Atkinson Hyperlegible', sans-serif; font-weight: 600; font-size: 0.95rem;
      cursor: pointer; border: 2px solid transparent;
      transition: background .15s, border-color .15s, transform .1s, box-shadow .15s;
      text-decoration: none; line-height: 1.3;
    }
    .btn:active { transform: scale(0.98); }

    .btn-primary { background: var(--violet); color: #fff; border-color: var(--violet); }
    .btn-primary:hover { background: var(--violet-h); border-color: var(--violet-h); }

    .btn-ghost { background: transparent; color: var(--violet); border-color: var(--violet); }
    .btn-ghost:hover { background: #eeeef8; }

    /* ── Mode Cards (home) ─────────────────────────────────────────── */
    .mode-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 22px 24px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s, transform .12s;
      text-align: left; width: 100%;
      font-family: 'Atkinson Hyperlegible', sans-serif;
      display: flex; align-items: flex-start; gap: 20px;
    }
    .mode-card:hover {
      border-color: var(--violet);
      box-shadow: 0 6px 20px rgba(38,45,104,.14);
      transform: translateY(-2px);
    }
    .mode-card:active { transform: translateY(0); }
    .mode-card:focus-visible { outline-offset: 4px; }

    .mode-num {
      font-family: 'Bungee', cursive;
      font-size: 2.2rem; color: var(--violet);
      line-height: 1; min-width: 48px; text-align: center;
      margin-top: 2px;
    }
    .mode-body h2 { font-size: 1.05rem; color: var(--text); margin-bottom: 4px; font-family: 'Atkinson Hyperlegible', sans-serif; font-weight: 700; }
    .mode-body p  { font-size: 0.875rem; color: var(--muted); font-weight: 400; line-height: 1.45; font-family: 'Atkinson Hyperlegible', sans-serif; }

    .badge {
      display: inline-block;
      padding: 3px 10px; border-radius: 99px;
      font-size: 0.75rem; font-weight: 600; margin-top: 8px;
    }

    /* ── Progress Bar ──────────────────────────────────────────────── */
    .progress-track {
      height: 8px; background: #dfe0ee; border-radius: 99px;
      overflow: hidden; margin-bottom: 22px;
    }
    .progress-fill {
      height: 100%; background: var(--violet); border-radius: 99px;
      transition: width .35s cubic-bezier(.4,0,.2,1);
    }

    /* ── Answer Buttons ────────────────────────────────────────────── */
    .ans-btn {
      width: 100%; text-align: left;
      padding: 13px 16px; border-radius: 10px;
      font-family: 'Atkinson Hyperlegible', sans-serif; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; border: 2px solid var(--border);
      background: var(--card); color: var(--text);
      transition: background .12s, border-color .12s, transform .1s, color .12s;
      display: flex; align-items: center; gap: 10px;
      line-height: 1.35; min-height: 50px;
    }
    .ans-btn:hover:not(:disabled) { background: #eeeef8; border-color: var(--violet); }
    .ans-btn:active:not(:disabled) { transform: scale(0.99); }
    .ans-btn:disabled { cursor: default; }

    .ans-btn.state-correct  { background: var(--green); border-color: var(--green); color: #fff; }
    .ans-btn.state-wrong    { background: var(--red);   border-color: var(--red);   color: #fff; }
    .ans-btn.state-reveal   { background: var(--green); border-color: var(--green); color: #fff; }
    .ans-btn.state-dimmed   { opacity: .40; }

    .ans-icon { font-size: 1.05em; flex-shrink: 0; width: 20px; text-align: center; }

    /* ── Feedback Banner ───────────────────────────────────────────── */
    .feedback-box {
      border-radius: 10px; padding: 14px 18px;
      display: flex; align-items: flex-start; gap: 12px;
      margin-top: 16px; border-left: 5px solid;
    }
    .feedback-box.correct  { background: #e4f4eb; border-color: var(--green); color: #04401c; }
    .feedback-box.wrong    { background: #fbeaec; border-color: var(--red);   color: #6b0a13; }
    .feedback-icon { font-size: 1.4rem; flex-shrink: 0; margin-top: -2px; }
    .feedback-label { font-weight: 700; font-size: 1rem; margin-bottom: 3px; }
    .feedback-text  { font-size: 0.875rem; font-weight: 400; line-height: 1.5; }

    /* ── Question display ──────────────────────────────────────────── */
    .q-label {
      font-size: 0.78rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .09em; margin-bottom: 8px;
    }
    .q-main {
      font-family: 'Atkinson Hyperlegible', sans-serif;
      font-size: clamp(1.25rem, 4vw, 1.75rem); font-weight: 700;
      color: var(--violet); line-height: 1.2; margin-bottom: 6px;
      word-break: break-word;
    }
    .q-sub {
      font-size: 0.85rem; color: var(--muted); font-weight: 400;
      font-style: italic; margin-bottom: 24px;
    }

    /* ── Reference table ───────────────────────────────────────────── */
    .ref-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .ref-table th {
      background: var(--violet); color: #fff;
      padding: 9px 12px; text-align: left; font-weight: 600;
    }
    .ref-table th:first-child { border-radius: 6px 0 0 0; }
    .ref-table th:last-child  { border-radius: 0 6px 0 0; }
    .ref-table td { padding: 9px 12px; border-bottom: 1px solid #e8e8ee; vertical-align: top; }
    .ref-table tr:last-child td { border-bottom: none; }
    .ref-table tr:nth-child(even) td { background: #f8f8fb; }

    /* ── Results ───────────────────────────────────────────────────── */
    .score-circle {
      width: 110px; height: 110px; border-radius: 50%;
      background: var(--violet);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; margin: 0 auto 16px;
      box-shadow: 0 4px 20px rgba(38,45,104,.25);
    }
    .score-num   { font-family: 'Atkinson Hyperlegible', sans-serif; font-weight: 700; font-size: 2.2rem; color: #fff; line-height: 1; }
    .score-denom { font-size: 0.8rem; color: rgba(255,255,255,.7); margin-top: 2px; }

    .section-heading {
      font-family: 'Atkinson Hyperlegible', sans-serif;
      font-weight: 700;
      font-size: 1.2rem; color: var(--violet);
      margin-bottom: 14px;
    }

    /* ── Tweaks panel ──────────────────────────────────────────────── */
    .tweaks-panel {
      position: fixed; bottom: 20px; right: 20px;
      background: var(--violet); color: #fff;
      border-radius: 14px; padding: 18px 22px;
      box-shadow: 0 8px 28px rgba(38,45,104,.35);
      width: 260px; font-size: 0.875rem;
      z-index: 100;
      display: none;
    }
    .tweaks-panel.open { display: block; }
    .tweaks-panel h3 {
      font-family: 'Atkinson Hyperlegible', sans-serif; font-weight: 700; font-size: 1rem; margin-bottom: 14px;
    }
    .tweak-row {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px;
    }
    .tweak-row label { font-weight: 600; }
    .tweak-row select, .tweak-row input[type=range] {
      font-family: 'Atkinson Hyperlegible', sans-serif;
      border-radius: 6px; border: none;
      padding: 4px 8px; font-size: 0.85rem;
      background: rgba(255,255,255,.15); color: #fff;
      cursor: pointer;
    }
    .tweak-row input[type=range] { padding: 0; width: 100px; accent-color: var(--yellow); }
    .tweak-row input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--yellow); }

    /* ── Details/summary ───────────────────────────────────────────── */
    details summary { cursor: pointer; list-style: none; user-select: none; }
    details summary::-webkit-details-marker { display: none; }

    /* ── Animations ────────────────────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp .25s ease both; }

    @media (max-width: 480px) {
      .card { padding: 18px; }
      .site-header { padding: 14px 16px 12px; }
    }
  </style>

    /* ════════════════════════════════════════════════════════════════
       HELPERS
    ════════════════════════════════════════════════════════════════ */
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function startsWithVowel(s) { return 'AEIOU'.includes(s[0].toUpperCase()); }

    const LEVELS_KEY = 'acct2301_levels';
    const _BAKED_LEVELS = {"Cash":1,"Petty Cash":0,"Accounts Receivable":1,"Allowance for Uncollectible Accounts":2,"Notes Receivable":1,"Interest Receivable":1,"Supplies":1,"Inventory":2,"Prepaid Insurance":1,"Prepaid Rent":1,"Prepaid Advertising":1,"Land":1,"Buildings":1,"Land Improvements":0,"Equipment":1,"Accumulated Depreciation":2,"Patents":2,"Copyrights":2,"Trademarks":2,"Franchises":2,"Goodwill":2,"Accounts Payable":1,"Notes Payable":1,"Deferred Revenue":1,"Salaries Payable":1,"Interest Payable":1,"Utilities Payable":1,"Dividends Payable":3,"Income Tax Payable":2,"Employee Income Tax Payable":3,"FICA Tax Payable":3,"Sales Tax Payable":3,"Warranty Liability":3,"Bonds Payable":3,"Contingent Liability":3,"Fringe Benefits Payable":3,"Unemployment Tax Payable":3,"Common Stock":1,"Preferred Stock":3,"Additional Paid-in Capital":3,"Retained Earnings":1,"Treasury Stock":3,"Dividends (Cash)":1,"Stock Dividends":3,"Service Revenue":1,"Sales Revenue":2,"Interest Revenue":1,"Gain":2,"Sales Discounts":2,"Sales Returns":2,"Sales Allowances":2,"Advertising Expense":1,"Amortization Expense":2,"Bad Debt Expense":2,"Cost of Goods Sold":2,"Delivery Expense":1,"Depreciation Expense":1,"Income Tax Expense":1,"Insurance Expense":1,"Interest Expense":1,"Legal Fees Expense":1,"Payroll Tax Expense":3,"Property Tax Expense":1,"Rent Expense":1,"Repairs and Maintenance Expense":1,"Salaries Expense":1,"Service Fee Expense":1,"Supplies Expense":1,"Utilities Expense":1,"Warranty Expense":3,"Loss":2};
    function loadLevels() { return Object.assign({}, _BAKED_LEVELS); }

    const SCF_NOTE = 'The Statement of Cash Flows is derived from changes in balance sheet accounts and cash activity — it does not have its own account category in the chart of accounts.';

    function generateQuestions(mode, count, pool = ACCOUNTS) {
      if (mode === 1) {
        return shuffle(pool).slice(0, count).map(acc => {
          const cat = CATEGORIES[acc.cat];
          return {
            id: Math.random(),
            stem: 'Which category does this account belong to?',
            highlight: acc.name,
            sub: null,
            options: Object.entries(CATEGORIES).map(([k, c]) => ({ key: k, label: c.label })),
            answer: acc.cat,
            explanation: `${acc.name} is a${startsWithVowel(cat.label) ? 'n' : ''} ${cat.label} account — ${cat.desc}.`,
          };
        });
      }

      if (mode === 2) {
        return shuffle(Object.entries(CATEGORIES)).map(([key, cat]) => ({
          id: Math.random(),
          stem: 'Which financial statement features this category?',
          highlight: cat.label,
          sub: cat.desc,
          options: STATEMENTS.map(s => ({ key: s, label: s })),
          answer: cat.statement,
          explanation: `${cat.label} accounts (${cat.desc}) appear on the ${cat.statement}.`,
        }));
      }

      if (mode === 3) {
        return shuffle(pool).slice(0, count).map(acc => {
          const cat = CATEGORIES[acc.cat];
          return {
            id: Math.random(),
            twopart: true,
            highlight: acc.name,
            answerCat: acc.cat,
            answerStatement: cat.statement,
            catOptions: Object.entries(CATEGORIES).map(([k,c]) => ({ key: k, label: c.label })),
            stmtOptions: STATEMENTS.map(s => ({ key: s, label: s })),
            explanationCat: `${acc.name} is a${startsWithVowel(cat.label) ? 'n' : ''} ${cat.label} account — ${cat.desc}.`,
            explanationStmt: `${cat.label} accounts appear on the ${cat.statement}.`,
          };
        });
      }
    }

    /* ════════════════════════════════════════════════════════════════

    ════════════════════════════════════════════════════════════════ */
    function TwoPartQuestion({ q, onSubmit }) {
      const [selCat,  setSelCat]  = useState(null);
      const [selStmt, setSelStmt] = useState(null);
      const [checked, setChecked] = useState(false);

      const catCorrect  = selCat  === q.answerCat;
      const stmtCorrect = selStmt === q.answerStatement;
      const bothCorrect = catCorrect && stmtCorrect;

      function catBtnClass(key) {
        if (!checked) return selCat === key ? 'ans-btn' : 'ans-btn';
        if (key === q.answerCat && key === selCat) return 'ans-btn state-correct';
        if (key === selCat)      return 'ans-btn state-wrong';
        if (key === q.answerCat) return 'ans-btn state-reveal';
        return 'ans-btn state-dimmed';
      }
      function stmtBtnClass(key) {
        if (!checked) return 'ans-btn';
        if (key === q.answerStatement && key === selStmt) return 'ans-btn state-correct';
        if (key === selStmt)            return 'ans-btn state-wrong';
        if (key === q.answerStatement)  return 'ans-btn state-reveal';
        return 'ans-btn state-dimmed';
      }

      return (
        <div>
          {/* Part 1 */}
          <div style={{marginBottom: 22}}>
            <p className="q-label">Part 1 — Which category does this account belong to?</p>
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8}} role="group" aria-label="Category choices">
              {q.catOptions.map(opt => {
                const selected = selCat === opt.key;
                return (
                  <button
                    key={opt.key}
                    className={catBtnClass(opt.key)}
                    onClick={() => !checked && setSelCat(opt.key)}
                    disabled={checked}
                    aria-pressed={selected}
                    style={!checked && selected ? {borderColor:'var(--violet)', background:'#eeeef8'} : {}}
                  >
                    <span className="ans-icon" aria-hidden="true">
                      {checked && opt.key === q.answerCat ? '✓' :
                       checked && opt.key === selCat && opt.key !== q.answerCat ? '✗' : ''}
                    </span>
                    {opt.label}
                  </button>
                );
              })}
            </div>
          </div>

          {/* Divider */}
          <div style={{borderTop:'2px dashed #e0e0ee', marginBottom:22, position:'relative'}}>
            <span style={{
              position:'absolute', top:-11, left:'50%', transform:'translateX(-50%)',
              background:'#fff', padding:'0 10px',
              fontSize:'0.78rem', fontWeight:700, color: selCat ? 'var(--violet)' : '#bbb',
              letterSpacing:'.06em',
            }}>THEN</span>
          </div>

          {/* Part 2 */}
          <div style={{opacity: selCat ? 1 : 0.35, transition:'opacity .2s', pointerEvents: selCat ? 'auto' : 'none'}}>
            <p className="q-label">Part 2 — Which financial statement features this account?</p>
            {!selCat && <p style={{fontSize:'0.8rem', color:'var(--muted)', fontWeight:400, marginBottom:10, fontStyle:'italic'}}>Select a category above to unlock.</p>}
            <div style={{display:'flex', flexDirection:'column', gap:8}} role="group" aria-label="Statement choices">
              {q.stmtOptions.map(opt => {
                const selected = selStmt === opt.key;
                return (
                  <button
                    key={opt.key}
                    className={stmtBtnClass(opt.key)}
                    onClick={() => selCat && !checked && setSelStmt(opt.key)}
                    disabled={checked || !selCat}
                    aria-pressed={selected}
                    style={!checked && selected ? {borderColor:'var(--violet)', background:'#eeeef8'} : {}}
                  >
                    <span className="ans-icon" aria-hidden="true">
                      {checked && opt.key === q.answerStatement ? '✓' :
                       checked && opt.key === selStmt && opt.key !== q.answerStatement ? '✗' : ''}
                    </span>
                    {opt.label}
                  </button>
                );
              })}
            </div>
          </div>

          {/* Check Answers button */}
          {!checked && selCat && selStmt && (
            <button
              className="btn btn-primary"
              onClick={() => setChecked(true)}
              style={{marginTop:18, width:'100%'}}
            >
              Check Answers
            </button>
          )}

          {/* Feedback */}
          {checked && (
            <div style={{marginTop:16}}>
              <div className={`feedback-box ${catCorrect ? 'correct' : 'wrong'}`} role="alert" style={{marginBottom:8}}>
                <span className="feedback-icon" aria-hidden="true">{catCorrect ? '✓' : '✗'}</span>
                <div>
                  <p className="feedback-label">Category: {catCorrect ? 'Correct!' : 'Not quite.'}</p>
                  <p className="feedback-text">{q.explanationCat}</p>
                </div>
              </div>
              <div className={`feedback-box ${stmtCorrect ? 'correct' : 'wrong'}`} role="alert">
                <span className="feedback-icon" aria-hidden="true">{stmtCorrect ? '✓' : '✗'}</span>
                <div>
                  <p className="feedback-label">Statement: {stmtCorrect ? 'Correct!' : 'Not quite.'}</p>
                  <p className="feedback-text">{q.explanationStmt}</p>
                  {!stmtCorrect && selStmt === 'Statement of Cash Flows' && (
                    <p className="feedback-text" style={{marginTop:6, fontStyle:'italic'}}>{SCF_NOTE}</p>
                  )}
                </div>
              </div>
              <button
                className="btn btn-primary"
                onClick={() => onSubmit({ selCat, selStmt, catCorrect, stmtCorrect, bothCorrect })}
                style={{marginTop:14, width:'100%'}}
              >
                Next Question →
              </button>
            </div>
          )}
        </div>
      );
    }

    /* ════════════════════════════════════════════════════════════════
       QUIZ SCREEN
    ════════════════════════════════════════════════════════════════ */
    function QuizScreen({ mode, questions, onFinish, showHints }) {
      const [idx, setIdx]         = useState(0);
      const [selected, setSelected] = useState(null);
      const [results, setResults] = useState([]);
      const [animKey, setAnimKey] = useState(0);
      const nextRef = useRef(null);
      const cardRef = useRef(null);

      const q        = questions[idx];
      const answered = selected !== null;
      const isCorrect = answered && selected === q.answer;
      const correct  = results.filter(r => r.ok).length;
      const total    = questions.length;

      function choose(key) {
        if (answered) return;
        setSelected(key);
        setTimeout(() => nextRef.current?.focus(), 80);
      }

      function next() {
        const entry = { question: q, selected, correct: q.answer, ok: selected === q.answer };
        const newResults = [...results, entry];
        if (idx + 1 >= total) { onFinish(newResults); }
        else {
          setResults(newResults);
          setIdx(i => i+1);
          setSelected(null);
          setAnimKey(k => k+1);
          cardRef.current?.focus();
        }
      }

      function handleTwoPart({ selCat, selStmt, catCorrect, stmtCorrect, bothCorrect }) {
        const entry = {
          twopart: true,
          question: q,
          selCat, selStmt,
          catCorrect, stmtCorrect,
          ok: bothCorrect,
        };
        const newResults = [...results, entry];
        if (idx + 1 >= total) { onFinish(newResults); }
        else {
          setResults(newResults);
          setIdx(i => i+1);
          setAnimKey(k => k+1);
          cardRef.current?.focus();
        }
      }

      function btnClass(key) {
        if (!answered) return '';
        if (key === q.answer && key === selected) return 'state-correct';
        if (key === selected)  return 'state-wrong';
        if (key === q.answer)  return 'state-reveal';
        return 'state-dimmed';
      }

      const isMode1 = mode === 1;
      const optGrid = isMode1
        ? { display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }
        : { display:'flex', flexDirection:'column', gap:10 };

      return (
        <div className="stack-lg fade-up">
          <div aria-live="polite" aria-atomic="true" className="sr-only">
            {answered ? (isCorrect ? 'Correct. ' : 'Incorrect. ') + q.explanation
              : `Question ${idx+1} of ${total}: ${q.stem || ''} ${q.highlight}`}
          </div>

          <div>
            <div className="row-between" style={{marginBottom:8}}>
              <span style={{fontSize:'0.85rem', fontWeight:600, color:'var(--muted)'}}>
                Question {idx+1} of {total}
              </span>
              <span style={{fontSize:'0.85rem', fontWeight:700, color:'var(--violet)'}}>
                {correct} correct
              </span>
            </div>
            <div className="progress-track"
              role="progressbar"
              aria-valuenow={idx} aria-valuemin={0} aria-valuemax={total}
              aria-label={`Progress: question ${idx+1} of ${total}`}>
              <div className="progress-fill" style={{width:`${(idx/total)*100}%`}} />
            </div>
          </div>

          <div className="card fade-up" key={animKey} ref={cardRef} tabIndex={-1} style={{outline:'none'}}>
            <p className="q-main">{q.highlight}</p>

            {q.twopart ? (
              <TwoPartQuestion q={q} onSubmit={handleTwoPart} />
            ) : (
              <>
                <p className="q-label" style={{marginBottom:16}}>{q.stem}</p>
                {q.sub && (showHints || q.pairStep === 2) && (
                  <p className="q-sub">{q.sub}</p>
                )}
                <div style={optGrid} role="group" aria-label="Answer choices">
                  {q.options.map(opt => {
                    const cls = btnClass(opt.key);
                    return (
                      <button
                        key={opt.key}
                        className={`ans-btn ${cls}`}
                        onClick={() => choose(opt.key)}
                        disabled={answered}
                        aria-pressed={selected === opt.key ? true : undefined}
                        aria-label={
                          !answered ? opt.label :
                          opt.key === q.answer ? `${opt.label} — correct answer` :
                          opt.key === selected ? `${opt.label} — your incorrect answer` :
                          opt.label
                        }
                      >
                        <span className="ans-icon" aria-hidden="true">
                          {answered && opt.key === q.answer ? '✓' :
                           answered && opt.key === selected && opt.key !== q.answer ? '✗' : ''}
                        </span>
                        {opt.label}
                      </button>
                    );
                  })}
                </div>
                {answered && (
                  <div className={`feedback-box ${isCorrect ? 'correct' : 'wrong'}`} role="alert">
                    <span className="feedback-icon" aria-hidden="true">{isCorrect ? '✓' : '✗'}</span>
                    <div>
                      <p className="feedback-label">{isCorrect ? 'Correct!' : 'Not quite.'}</p>
                      <p className="feedback-text">{q.explanation}</p>
                      {!isCorrect && selected === 'Statement of Cash Flows' && (
                        <p className="feedback-text" style={{marginTop:6, fontStyle:'italic'}}>{SCF_NOTE}</p>
                      )}
                    </div>
                  </div>
                )}
                {answered && (
                  <button ref={nextRef} className="btn btn-primary" onClick={next}
                    style={{marginTop:18, width:'100%'}}>
                    {idx+1 >= total ? 'See My Results →' : 'Next Question →'}
                  </button>
                )}
              </>
            )}
          </div>
        </div>
      );
    }

    /* ════════════════════════════════════════════════════════════════
       RESULTS SCREEN
    ════════════════════════════════════════════════════════════════ */
    function ResultsScreen({ results, onRetry, onHome }) {
      const score  = results.filter(r => r.ok).length;
      const total  = results.length;
      const pct    = Math.round((score / total) * 100);
      const missed = results.filter(r => !r.ok);

      const { grade, color } =
        pct >= 90 ? { grade: 'Excellent Work!',  color: '#0A713A' } :
        pct >= 75 ? { grade: 'Good Job!',         color: '#5c4800' } :
        pct >= 60 ? { grade: 'Keep Practicing!',  color: '#7a3a00' } :
                    { grade: 'Review & Try Again', color: '#a31524' };

      return (
        <div className="stack-lg fade-up">
          <div className="card" style={{textAlign:'center'}}>
            <div className="score-circle" aria-label={`Final score: ${score} out of ${total}`}>
              <span className="score-num">{score}</span>
              <span className="score-denom">/ {total}</span>
            </div>
            <p style={{fontFamily:'Atkinson Hyperlegible,sans-serif', fontWeight:700, fontSize:'1.5rem', color, marginBottom:4}}>{grade}</p>
            <p style={{color:'var(--muted)', fontWeight:400}}>{pct}% correct</p>
            <div className="row" style={{justifyContent:'center', marginTop:22, flexWrap:'wrap'}}>
              <button className="btn btn-primary" onClick={onRetry}>Try Again</button>
              <button className="btn btn-ghost"   onClick={onHome}>Change Mode</button>
            </div>
          </div>

          {missed.length === 0 && (
            <div className="card" style={{textAlign:'center', borderTop:`4px solid ${color}`}}>
              <p style={{fontSize:'1.5rem', marginBottom:8}} aria-hidden="true">🎉</p>
              <p style={{fontWeight:700, color:'var(--green)'}}>Perfect score — every account correctly identified!</p>
            </div>
          )}

          {missed.length > 0 && (
            <div className="card">
              <h2 className="section-heading">Review These ({missed.length})</h2>
              <div className="stack">
                {missed.map((r, i) => (
                  <div key={i} style={{padding:'14px 16px', borderRadius:10, background:'#fbeaec', borderLeft:'4px solid var(--red)'}}>
                    <p style={{fontWeight:700, color:'var(--text)', marginBottom:8}}>{r.question.highlight}</p>
                    {r.twopart ? (
                      <>
                        {!r.catCorrect && (
                          <div style={{marginBottom:6}}>
                            <p style={{fontSize:'0.82rem', color:'#6b0a13', fontWeight:400, marginBottom:2}}>
                              <strong>Category you chose:</strong> {r.question.catOptions.find(o=>o.key===r.selCat)?.label ?? r.selCat}
                            </p>
                            <p style={{fontSize:'0.82rem', color:'#04401c', fontWeight:600}}>
                              ✓ Correct category: {r.question.catOptions.find(o=>o.key===r.question.answerCat)?.label}
                            </p>
                            <p style={{fontSize:'0.79rem', color:'var(--muted)', fontWeight:400, marginTop:3, fontStyle:'italic'}}>{r.question.explanationCat}</p>
                          </div>
                        )}
                        {!r.stmtCorrect && (
                          <div>
                            <p style={{fontSize:'0.82rem', color:'#6b0a13', fontWeight:400, marginBottom:2}}>
                              <strong>Statement you chose:</strong> {r.selStmt ?? 'None'}
                            </p>
                            <p style={{fontSize:'0.82rem', color:'#04401c', fontWeight:600}}>
                              ✓ Correct statement: {r.question.answerStatement}
                            </p>
                            <p style={{fontSize:'0.79rem', color:'var(--muted)', fontWeight:400, marginTop:3, fontStyle:'italic'}}>{r.question.explanationStmt}</p>
                            {r.selStmt === 'Statement of Cash Flows' && (
                              <p style={{fontSize:'0.79rem', color:'var(--muted)', fontWeight:400, marginTop:3, fontStyle:'italic'}}>{SCF_NOTE}</p>
                            )}
                          </div>
                        )}
                      </>
                    ) : (
                      <>
                        <p style={{fontSize:'0.85rem', color:'#6b0a13', fontWeight:400, marginBottom:3}}>
                          <strong>You answered:</strong> {r.question.options.find(o=>o.key===r.selected)?.label ?? r.selected}
                        </p>
                        <p style={{fontSize:'0.85rem', color:'#04401c', fontWeight:600}}>
                          ✓ Correct: {r.question.options.find(o=>o.key===r.correct)?.label ?? r.correct}
                        </p>
                        <p style={{fontSize:'0.8rem', color:'var(--muted)', fontWeight:400, marginTop:4, fontStyle:'italic'}}>{r.question.explanation}</p>
                      </>
                    )}
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ════════════════════════════════════════════════════════════════
       TWEAKS PANEL
    ════════════════════════════════════════════════════════════════ */
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "questionCount": 10,
      "showHints": true
    }/*EDITMODE-END*/;

    function TweaksPanel({ open, tweaks, onChange }) {
      return (
        <div className={`tweaks-panel ${open ? 'open' : ''}`} role="dialog" aria-label="Tweaks panel" aria-hidden={!open}>
          <h3>Tweaks</h3>
          <div className="tweak-row">
            <label htmlFor="tw-count">Questions per quiz</label>
            <div style={{display:'flex', alignItems:'center', gap:8}}>
              <input
                id="tw-count"
                type="range" min={5} max={30} step={5}
                value={tweaks.questionCount}
                onChange={e => onChange({ ...tweaks, questionCount: +e.target.value })}
                aria-label={`Questions per quiz: ${tweaks.questionCount}`}
              />
              <span style={{minWidth:24, fontWeight:700}}>{tweaks.questionCount}</span>
            </div>
          </div>
          <div className="tweak-row">
            <label htmlFor="tw-hints">Show hints</label>
            <input
              id="tw-hints"
              type="checkbox"
              checked={tweaks.showHints}
              onChange={e => onChange({ ...tweaks, showHints: e.target.checked })}
              aria-label={`Show hints: ${tweaks.showHints ? 'on' : 'off'}`}
            />
          </div>
        </div>
      );
    }

    /* ════════════════════════════════════════════════════════════════
       APP
    ════════════════════════════════════════════════════════════════ */
    function App() {
      const [screen,    setScreen]    = useState('welcome');
      const [mode,      setMode]      = useState(null);
      const [questions, setQuestions] = useState([]);
      const [results,   setResults]   = useState([]);
      const [tweaks,    setTweaks]    = useState(TWEAK_DEFAULTS);
      const [tweakOpen, setTweakOpen] = useState(false);
      const [section,   setSection]   = useState(0);
      const [levels,    setLevels]    = useState(loadLevels);

      // Reload levels from localStorage when returning to home
      function goHome() {
        setLevels(loadLevels());
        setScreen('welcome');
      }

      function getPool() {
        if (section === 0) return ACCOUNTS;
        return ACCOUNTS.filter(a => (levels[a.name] || 0) === section);
      }

      // Tweaks toolbar integration
      useEffect(() => {
        function onMsg(e) {
          if (e.data?.type === '__activate_edit_mode')   setTweakOpen(true);
          if (e.data?.type === '__deactivate_edit_mode') setTweakOpen(false);
        }
        window.addEventListener('message', onMsg);
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', onMsg);
      }, []);

      function handleTweakChange(t) {
        setTweaks(t);
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: t }, '*');
      }

      function startQuiz(m, defaultCount) {
        const pool = getPool();
        if (m !== 2 && pool.length === 0) return; // guard: no accounts in section
        const count = m === 2 ? 6 : Math.min(tweaks.questionCount, pool.length);
        setMode(m);
        setQuestions(generateQuestions(m, count, pool));
        setScreen('quiz');
      }

      function handleFinish(r) {
        setResults(r);
        setScreen('results');
      }

      function handleRetry() {
        const pool = getPool();
        const count = mode === 2 ? 6 : Math.min(tweaks.questionCount, pool.length);
        setQuestions(generateQuestions(mode, count, pool));
        setScreen('quiz');
      }

      return (
        <>
          {screen !== 'home' && (
            <div style={{marginBottom:18}}>
              <button
                className="btn btn-ghost"
                onClick={() => setScreen('welcome')}
                style={{padding:'8px 16px', fontSize:'0.875rem'}}
              >
                ← All Modes
              </button>
            </div>
          )}

          {screen === 'welcome' && <WelcomeScreen onStart={() => setScreen('home')} levels={levels} />}
          {screen === 'home'    && <HomeScreen onStart={startQuiz} qCount={tweaks.questionCount} section={section} setSection={setSection} levels={levels} />}
          {screen === 'quiz'    && <QuizScreen mode={mode} questions={questions} onFinish={handleFinish} showHints={tweaks.showHints} />}
          {screen === 'results' && <ResultsScreen results={results} onRetry={handleRetry} onHome={goHome} />}

          <TweaksPanel open={tweakOpen} tweaks={tweaks} onChange={handleTweakChange} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
